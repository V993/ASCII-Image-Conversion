<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII Image Converter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --border: #2e2e2e;
      --border-hover: #555;
      --accent: #7c6af7;
      --accent-dim: #4b3fc7;
      --text: #e0e0e0;
      --text-dim: #888;
      --red: #ff5555;
      --green: #50fa7b;
      --blue: #8be9fd;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    header p {
      margin-top: 0.4rem;
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    .card {
      width: 100%;
      max-width: 860px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }

    /* Drop zone */
    #drop-zone {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }

    #drop-zone:hover, #drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(124, 106, 247, 0.06);
    }

    #drop-zone svg {
      width: 40px;
      height: 40px;
      margin-bottom: 0.75rem;
      opacity: 0.5;
    }

    #drop-zone p { color: var(--text-dim); font-size: 0.9rem; }
    #drop-zone strong { color: var(--text); }

    #file-input { display: none; }

    /* Preview strip */
    #preview-strip {
      display: none;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 1rem;
    }

    #preview-strip img {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    #preview-strip .file-info { flex: 1; }
    #preview-strip .file-name { font-size: 0.875rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
    #preview-strip .file-size { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.15rem; }

    #clear-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 0.3rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: border-color 0.15s, color 0.15s;
    }

    #clear-btn:hover { border-color: var(--border-hover); color: var(--text); }

    /* Controls */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      align-items: center;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .control-group label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
    }

    .control-group .value-display {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 600;
      min-width: 3ch;
      display: inline-block;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 150px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.1s;
    }

    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

    .toggle-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      padding: 0.35rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }

    .toggle:hover { border-color: var(--border-hover); }
    .toggle.active { border-color: var(--accent); background: rgba(124, 106, 247, 0.1); color: var(--accent); }

    .toggle input { display: none; }

    .divider { width: 1px; height: 32px; background: var(--border); }

    .btn-row {
      display: flex;
      gap: 0.6rem;
      margin-left: auto;
    }

    button.action-btn {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 1rem;
      border-radius: 7px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }

    button.action-btn:hover:not(:disabled) { border-color: var(--border-hover); background: #222; }
    button.action-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    button.action-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.action-btn.primary:hover:not(:disabled) { background: var(--accent-dim); border-color: var(--accent-dim); }

    /* Output */
    #output-section { display: none; }

    #output-wrapper {
      overflow: auto;
      background: #000;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      max-height: 70vh;
    }

    #output {
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      line-height: 1.2;
      white-space: pre;
      color: #fff;
    }

    #output .cr { color: var(--red); }
    #output .cg { color: var(--green); }
    #output .cb { color: var(--blue); }
    #output .cd { color: transparent; }

    /* Loading spinner */
    #spinner {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 1rem;
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    .spin {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #222;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      font-size: 0.85rem;
      transition: transform 0.25s ease;
      pointer-events: none;
      z-index: 100;
    }

    #toast.show { transform: translateX(-50%) translateY(0); }

    /* Font size control */
    #font-size-display { min-width: 3ch; }

    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>ASCII Image Converter</h1>
    <p>Drop an image to transform it into ASCII art</p>
  </header>

  <!-- Upload card -->
  <div class="card">
    <div id="drop-zone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M4 16l4-4 4 4 4-6 4 6"/>
        <rect x="3" y="3" width="18" height="18" rx="2"/>
      </svg>
      <p><strong>Drop an image here</strong></p>
      <p style="margin-top:0.35rem">or <span style="color:var(--accent);text-decoration:underline;cursor:pointer" id="browse-link">browse to upload</span></p>
      <p style="margin-top:0.5rem;font-size:0.78rem">JPEG · PNG · WebP · GIF · BMP</p>
    </div>
    <input type="file" id="file-input" accept="image/*">
    <div id="preview-strip">
      <img id="preview-img" src="" alt="">
      <div class="file-info">
        <div class="file-name" id="file-name"></div>
        <div class="file-size" id="file-size"></div>
      </div>
      <button id="clear-btn">Clear</button>
    </div>
  </div>

  <!-- Controls card -->
  <div class="card">
    <div class="section-label">Settings</div>
    <div class="controls">
      <div class="control-group">
        <label>Width &nbsp;<span class="value-display" id="width-display">100</span> chars</label>
        <input type="range" id="width-range" min="20" max="250" value="100" step="5">
      </div>
      <div class="control-group">
        <label>Font size &nbsp;<span class="value-display" id="font-size-display">10</span>px</label>
        <input type="range" id="font-size-range" min="5" max="20" value="10" step="1">
      </div>
      <div class="divider"></div>
      <div class="toggle-row">
        <label class="toggle" id="toggle-mono">
          <input type="checkbox" id="monochrome">
          <span>Monochrome</span>
        </label>
        <label class="toggle" id="toggle-invert">
          <input type="checkbox" id="invert">
          <span>Invert</span>
        </label>
      </div>
      <div class="btn-row">
        <button class="action-btn" id="copy-btn" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          Copy
        </button>
        <button class="action-btn" id="download-btn" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16l-4-4h3V4h2v8h3l-4 4z"/><path d="M4 20h16"/></svg>
          Download
        </button>
      </div>
    </div>
  </div>

  <!-- Output card -->
  <div class="card" id="output-section">
    <div id="spinner"><div class="spin"></div> Converting…</div>
    <div id="output-wrapper">
      <pre id="output"></pre>
    </div>
  </div>

  <canvas id="canvas" style="display:none"></canvas>
  <div id="toast"></div>

  <script>
    // ── Algorithm (ported from ascii_pictures.py) ─────────────────────────────

    const CHARS = ['  ', ',,', ';;', '**', 'oo', '))', '//', '00', '$$', '@@'];

    function getIntensity(r, g, b, a) {
      return (r + g + b + a) / (255 * 4);
    }

    function getCharacter(intensity) {
      const idx = Math.min(Math.round(intensity * CHARS.length), CHARS.length - 1);
      return CHARS[idx];
    }

    // Returns 'cr' | 'cg' | 'cb' | 'cd' (CSS class)
    function getColorClass(r, g, b) {
      const mx = Math.max(r, g, b);
      if (mx < 50) return 'cd';
      if (r >= g && r >= b) return 'cr';
      if (g >= r && g >= b) return 'cg';
      return 'cb';
    }

    function convert(imageData, width, height, monochrome) {
      const data = imageData.data;
      let html = '';
      let plain = '';

      for (let y = 0; y < height; y++) {
        // Run-length encode by color class to minimize DOM nodes
        let runClass = null;
        let runChars = '';

        function flushRun() {
          if (!runChars) return;
          if (monochrome || runClass === null) {
            html += runChars;
          } else {
            html += `<span class="${runClass}">${runChars}</span>`;
          }
          runChars = '';
        }

        for (let x = 0; x < width; x++) {
          const i = (y * width + x) * 4;
          const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];

          const intensity = getIntensity(r, g, b, a);
          const ch = getCharacter(intensity);
          const cls = monochrome ? null : getColorClass(r, g, b);

          plain += ch;

          if (cls !== runClass) {
            flushRun();
            runClass = cls;
          }
          runChars += ch;
        }

        flushRun();
        html += '\n';
        plain += '\n';
      }

      return { html, plain };
    }

    // ── State ─────────────────────────────────────────────────────────────────

    let currentFile = null;
    let plainText = '';

    // ── DOM refs ──────────────────────────────────────────────────────────────

    const dropZone     = document.getElementById('drop-zone');
    const fileInput    = document.getElementById('file-input');
    const browseLink   = document.getElementById('browse-link');
    const previewStrip = document.getElementById('preview-strip');
    const previewImg   = document.getElementById('preview-img');
    const fileNameEl   = document.getElementById('file-name');
    const fileSizeEl   = document.getElementById('file-size');
    const clearBtn     = document.getElementById('clear-btn');
    const widthRange   = document.getElementById('width-range');
    const widthDisplay = document.getElementById('width-display');
    const fontRange    = document.getElementById('font-size-range');
    const fontDisplay  = document.getElementById('font-size-display');
    const monoCheck    = document.getElementById('monochrome');
    const invertCheck  = document.getElementById('invert');
    const toggleMono   = document.getElementById('toggle-mono');
    const toggleInvert = document.getElementById('toggle-invert');
    const copyBtn      = document.getElementById('copy-btn');
    const downloadBtn  = document.getElementById('download-btn');
    const outputSection= document.getElementById('output-section');
    const outputEl     = document.getElementById('output');
    const spinner      = document.getElementById('spinner');
    const canvas       = document.getElementById('canvas');
    const toast        = document.getElementById('toast');

    // ── Rendering ─────────────────────────────────────────────────────────────

    function renderImage() {
      if (!currentFile) return;

      outputSection.style.display = 'block';
      spinner.style.display = 'flex';
      outputEl.innerHTML = '';

      const url = URL.createObjectURL(currentFile);
      const img = new Image();

      img.onload = () => {
        const targetWidth = parseInt(widthRange.value);
        const targetHeight = Math.round(img.naturalHeight * (targetWidth / img.naturalWidth) * 0.5);

        canvas.width = targetWidth;
        canvas.height = targetHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, targetWidth, targetHeight);
        URL.revokeObjectURL(url);

        if (invertCheck.checked) {
          const imgData = ctx.getImageData(0, 0, targetWidth, targetHeight);
          const d = imgData.data;
          for (let i = 0; i < d.length; i += 4) {
            d[i]     = 255 - d[i];
            d[i + 1] = 255 - d[i + 1];
            d[i + 2] = 255 - d[i + 2];
          }
          ctx.putImageData(imgData, 0, 0);
        }

        const imgData = ctx.getImageData(0, 0, targetWidth, targetHeight);
        const mono = monoCheck.checked;
        const result = convert(imgData, targetWidth, targetHeight, mono);

        plainText = result.plain;
        outputEl.innerHTML = result.html;

        spinner.style.display = 'none';
        copyBtn.disabled = false;
        downloadBtn.disabled = false;
      };

      img.onerror = () => {
        spinner.style.display = 'none';
        showToast('Could not load image.');
        URL.revokeObjectURL(url);
      };

      img.src = url;
    }

    // ── File handling ─────────────────────────────────────────────────────────

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function loadFile(file) {
      if (!file || !file.type.startsWith('image/')) {
        showToast('Please drop an image file.');
        return;
      }

      currentFile = file;
      fileNameEl.textContent = file.name;
      fileSizeEl.textContent = formatBytes(file.size);
      previewImg.src = URL.createObjectURL(file);
      previewStrip.style.display = 'flex';

      renderImage();
    }

    function clearFile() {
      currentFile = null;
      plainText = '';
      fileInput.value = '';
      previewStrip.style.display = 'none';
      previewImg.src = '';
      outputSection.style.display = 'none';
      outputEl.innerHTML = '';
      copyBtn.disabled = true;
      downloadBtn.disabled = true;
    }

    // ── Event listeners ───────────────────────────────────────────────────────

    dropZone.addEventListener('click', () => fileInput.click());
    browseLink.addEventListener('click', (e) => { e.stopPropagation(); fileInput.click(); });

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      loadFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', () => loadFile(fileInput.files[0]));
    clearBtn.addEventListener('click', clearFile);

    widthRange.addEventListener('input', () => {
      widthDisplay.textContent = widthRange.value;
      renderImage();
    });

    fontRange.addEventListener('input', () => {
      const sz = fontRange.value;
      fontDisplay.textContent = sz;
      outputEl.style.fontSize = sz + 'px';
    });

    monoCheck.addEventListener('change', () => {
      toggleMono.classList.toggle('active', monoCheck.checked);
      renderImage();
    });

    invertCheck.addEventListener('change', () => {
      toggleInvert.classList.toggle('active', invertCheck.checked);
      renderImage();
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(plainText);
        showToast('Copied to clipboard!');
      } catch {
        showToast('Copy failed — try selecting and copying manually.');
      }
    });

    downloadBtn.addEventListener('click', () => {
      const blob = new Blob([plainText], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (currentFile?.name?.replace(/\.[^.]+$/, '') ?? 'ascii') + '.txt';
      a.click();
      URL.revokeObjectURL(a.href);
    });

    // ── Toast ─────────────────────────────────────────────────────────────────

    let toastTimer;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
